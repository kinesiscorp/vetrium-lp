<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradientes de Metal Titanio e Grafite -->
    <linearGradient id="m-left-outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8F96A3"/>
      <stop offset="35%" stop-color="#5A6170"/>
      <stop offset="85%" stop-color="#2D323E"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>

    <linearGradient id="m-left-inner" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6F7584"/>
      <stop offset="40%" stop-color="#3E4452"/>
      <stop offset="100%" stop-color="#1F232B"/>
    </linearGradient>

    <linearGradient id="m-top-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8BEC9"/>
      <stop offset="100%" stop-color="#8A92A0"/>
    </linearGradient>

    <linearGradient id="m-right-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B8291"/>
      <stop offset="100%" stop-color="#A2AAB8"/>
    </linearGradient>

    <linearGradient id="m-right-outer" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#505663"/>
      <stop offset="50%" stop-color="#2A2F3A"/>
      <stop offset="100%" stop-color="#13161C"/>
    </linearGradient>

    <linearGradient id="m-right-fold-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383D49"/>
      <stop offset="60%" stop-color="#1E222A"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>

    <linearGradient id="m-right-fold-2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>

    <!-- Gradientes de Neon Violeta / Luz Interna -->
    <linearGradient id="neon-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#9333EA" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#6D28D9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="neon-core" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Filtro de Bloom Suave -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- 1. ASA ESQUERDA - Faceta Externa Principal -->
    <path d="M 82 142 L 281 300 L 271 450 L 377 619 L 82 142 Z" 
          fill="url(#m-left-outer)"/>

    <!-- 2. ASA ESQUERDA - Faceta Interna Chanfrada -->
    <path d="M 82 142 L 244 142 L 400 380 L 377 619 L 271 450 L 281 300 Z" 
          fill="url(#m-left-inner)"/>

    <!-- 3. ASA ESQUERDA - Topo Biselado -->
    <path d="M 82 142 L 244 142 L 235 152 L 95 152 Z" 
          fill="url(#m-top-left)" opacity="0.85"/>

    <!-- 4. ASA DIREITA - Faceta Externa -->
    <path d="M 677 143 L 509 142 L 425 380 L 377 619 L 467 480 L 633 220 Z" 
          fill="url(#m-right-outer)"/>

    <!-- 5. ASA DIREITA - Topo Biselado -->
    <path d="M 509 142 L 677 143 L 662 153 L 522 152 Z" 
          fill="url(#m-right-top)" opacity="0.9"/>

    <!-- 6. ASA DIREITA - Dobra Geométrica / Painel Inclinado -->
    <path d="M 509 142 L 633 220 L 581 300 L 425 380 Z" 
          fill="url(#m-right-fold-1)"/>

    <!-- 7. ASA DIREITA - Cavidade Interna Sombreada -->
    <path d="M 581 300 L 445 453 L 425 380 Z" 
          fill="url(#m-right-fold-2)"/>

    <!-- 8. NÚCLEO DE LUZ NEON VIOLETA (Fissura Interna) -->
    <!-- Bloom / Brilho difuso de fundo -->
    <path d="M 244 142 L 400 380 L 377 619 L 425 380 L 509 142 L 431 220 Z" 
          fill="url(#neon-glow)" filter="url(#bloom)" opacity="0.75"/>

    <!-- Núcleo de luz afiado e intenso -->
    <path d="M 284 220 L 400 380 L 377 619 L 415 420 L 431 220 Z" 
          fill="url(#neon-core)"/>

    <!-- 9. ARESTAS DE PRECISÃO (Specular Highlights) -->
    <!-- Aresta da crista esquerda -->
    <path d="M 82 142 L 377 619" 
          stroke="#E2E8F0" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Aresta interna brilhante em violeta -->
    <path d="M 244 142 L 377 619" 
          stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round"/>

    <!-- Aresta da crista direita -->
    <path d="M 677 143 L 377 619" 
          stroke="#94A3B8" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- Linha de luz interna na fenda -->
    <path d="M 431 220 L 377 619" 
          stroke="#DDD6FE" stroke-width="1.2" stroke-opacity="0.9"/>
  </g>
</svg>